<style>
#ideas:empty{min-height:100vh}
.ideas{display:grid;gap:clamp(56px,7vw,110px);padding-block:clamp(48px,5vw,80px) clamp(80px,9vw,140px)}
.idea{display:grid;grid-template-columns:1.4fr 1fr;gap:clamp(28px,4vw,64px);align-items:center}
.idea:nth-child(even) .idea__img{order:2}
.idea__img{aspect-ratio:4/3;border-radius:var(--r);overflow:hidden;background:var(--panel)}
.idea__img img{width:100%;height:100%;object-fit:cover}
.idea .btn{margin-top:24px}
.idea i{font-style:normal;font-size:0.8125rem;font-weight:600;color:var(--red-ink);letter-spacing:.06em}
.idea h2{font-size:clamp(1.75rem,2.8vw,2.5rem);margin:12px 0 14px}
@media (max-width:1023px){.idea{grid-template-columns:1fr}.idea:nth-child(even) .idea__img{order:0}}
</style>

<body class="no-js" data-page="projects">
<main id="main">
  <header class="pagehead"><div class="wrap">
    <nav class="crumbs" aria-label="פירורי לחם"><a href="index.html">דף הבית</a><span>/</span><span>רעיונות</span></nav>
    <h1>רעיונות לתאורה</h1>
    <p class="lead">מה אפשר לעשות עם קו אור אחד. ראיתם משהו שאהבתם? שלחו לנו ונתכנן אותו איתכם, לפי המידות והחלל שלכם.</p><p class="muted" style="font-size:0.875rem;margin-top:10px">צילומי השראה: Unsplash</p>
  </div></header>
  <div class="wrap ideas" id="ideas"></div>
</main>
<script src="assets/js/products.js"></script>
<script src="assets/js/site.js"></script>
<script>
const IDEAS=[
  {img:'_KfmNN0dJLI',pos:'50% 58%',t:'מטבח',d:'קו אור רציף מתחת לארונות שמאיר את משטח העבודה, בלי נקודות ובלי סנוור.'},
  {img:'gNOE-4kcs-0',t:'מדרגות',d:'אור רך מתחת לכל מדרך, שמסמן את הדרך בלילה ונותן למדרגות נוכחות.'},
  {img:'Z8z_CbZxJ6U',t:'קירות וקורות מעוגלים',d:'קו אור שעוקב אחרי הקשת של הקיר, ומדגיש את הצורה של החלל.'},
  {img:'HU66Wc_71Vs',t:'מעקה מואר',d:'אור שהולך לאורך המעקה, בלי גוף תאורה גלוי.'},
  {img:'KYJHufdN2Nk',t:'גופים לינאריים תלויים',d:'קווי אור תלויים מעל שולחן, אי במטבח או עמדת קבלה.'},
  {img:'FmemkJ1k0JE',pos:'40% 45%',t:'חזיתות וקווי גג',d:'קו אור לאורך הגג והקורות שמדגיש את קווי המבנה בלילה.'}
];
document.getElementById('ideas').innerHTML=IDEAS.map((x,i)=>`<article class="idea">
  <div class="idea__img rv"><img src="assets/img/stock/${x.img}.jpg" alt="${x.t}" loading="lazy"${x.pos?` style="object-position:${x.pos}"`:''}></div>
  <div class="rv"><i>${String(i+1).padStart(2,'0')}</i><h2>${x.t}</h2><p class="lead">${x.d}</p>
  <a class="btn btn--line btn--sm" href="https://wa.me/${SITE.WA}?text=${encodeURIComponent('שלום, ראיתי באתר את הרעיון "'+x.t+'" ואשמח לשמוע איך עושים את זה אצלי')}" target="_blank" rel="noopener">רוצים משהו כזה? כתבו לנו</a></div>
</article>`).join('');
observeReveal();
</script>
